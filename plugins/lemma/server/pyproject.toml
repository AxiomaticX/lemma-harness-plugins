[project]
name = "lemma-mcp"
version = "0.1.0"
description = "Local MCP server and run wake-up hook for the Lemma Claude Code plugin"
requires-python = ">=3.12"
dependencies = [
    "filelock>=4.2",
    "httpx>=0.28",
    "keyring>=25",
    "mcp>=1.20",
]

[project.scripts]
lemma-mcp = "lemma_mcp.server:main"
lemma-wake = "lemma_mcp.wake:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemma_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
